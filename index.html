<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chessalatro</title>
  <link rel="stylesheet" href="src/assets/styles.css">
</head>
<body>
  <div id="intro-screen">
    <h1>Chessalatro</h1>
    <button id="start-normal">Start Normal Mode</button>
    <button id="start-permadeath">Start Permadeath Mode</button>
  </div>
  <div id="game-container" style="display: none;">
    <div id="status">Player's Turn</div>
    <div id="currency">Gold: 5</div>
    <div id="ai-currency">AI Gold: 5</div>
    <div id="round">Round: 1</div>
    <div id="board"></div>
    <div id="roster">
      <h2>Roster</h2>
      <div id="roster-grid"></div>
    </div>
    <div id="shop" style="display: none;">
      <h2>Shop</h2>
      <div class="pack" id="pack1">
        <img id="pack1-img" alt="Pack 1">
        <span id="pack1-text"></span>
        <button id="buy-pack1">Buy</button>
      </div>
      <div class="pack" id="pack2">
        <img id="pack2-img" alt="Pack 2">
        <span id="pack2-text"></span>
        <button id="buy-pack2">Buy</button>
      </div>
      <div class="pack" id="pack3">
        <img id="pack3-img" alt="Pack 3">
        <span id="pack3-text"></span>
        <button id="buy-pack3">Buy</button>
      </div>
      <button id="continue-button">Continue</button>
    </div>
    <div id="pack-selection" style="display: none;">
      <h2 id="pack-selection-title">Select a Piece</h2>
      <div class="pack-items-container"></div>
      <button id="skip-pack-button">Skip</button>
    </div>
    <div id="sell-confirmation" style="display: none;">
      <span id="sell-confirmation-text"></span>
      <button id="confirm-sell">Yes</button>
      <button id="cancel-sell">No</button>
    </div>
    <button id="restart-button" style="display: none;">Restart</button>
  </div>
  <script type="module" src="src/index.js"></script>
</body>
</html>
